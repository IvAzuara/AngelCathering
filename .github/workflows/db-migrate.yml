name: Database Migrations (Flyway on Supabase)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "sql/**"
      - ".github/workflows/db-migrate.yml"

jobs:
  migrate:
    name: Apply Flyway Migrations to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Flyway Migration
        uses: docker://flyway/flyway:11-alpine
        with:
          args: -url="${{ secrets.FLYWAY_URL }}" -user="${{ secrets.FLYWAY_USER }}" -password="${{ secrets.FLYWAY_PASSWORD }}" -locations="filesystem:sql" -baselineOnMigrate=true migrate
